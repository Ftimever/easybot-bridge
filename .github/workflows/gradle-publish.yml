name: Gradle Package

on:
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      skip_publish:
        description: '仅构建不发布 (Skip Publish)'
        required: true
        default: false
        type: boolean

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 22
        uses: actions/setup-java@v4
        with:
          java-version: '22'
          distribution: 'temurin'
          server-id: github
          settings-path: ${{ github.workspace }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@af1da67850ed9a4cedd57bfd976089dd991e2582 # v4.0.0

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew build

      # GitHub Packages 发布
      - name: Publish to GitHub Packages
        if: ${{ github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.skip_publish == false) }}
        run: ./gradlew publish
        env:
          USERNAME: ${{ github.actor }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # JitPack 主动触发构建
      - name: Trigger JitPack build
        if: ${{ github.event_name == 'release' }}
        run: |
          curl -X POST https://jitpack.io/api/builds \
            -H "Content-Type: application/json" \
            -d '{
              "gitRepoUrl": "https://github.com/${{ github.repository }}.git",
              "ref": "${{ github.ref_name }}"
            }'